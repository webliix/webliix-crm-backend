spring.application.name=webliix

# =========================================================
# SERVER
# =========================================================
server.port=${PORT:8082}

# =========================================================
# JWT
# =========================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:604800000}

# =========================================================
# DATABASE
# =========================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# =========================================================
# FLYWAY
# =========================================================
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=false

# =========================================================
# MAIL - BREVO SMTP
# =========================================================
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Short SMTP timeouts
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}

# Do not allow SMTP to make health checks hang
# management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}
management.endpoint.health.show-details=always
# =========================================================
# FILE UPLOAD
# =========================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:100MB}

# =========================================================
# STORAGE
# =========================================================
storage.provider=${STORAGE_PROVIDER:local}
storage.upload-dir=${STORAGE_UPLOAD_DIR:uploads}

# =========================================================
# CLOUDINARY
# =========================================================
cloudinary.url=${CLOUDINARY_URL:}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# =========================================================
# REDIS - UPSTASH
# =========================     ================================
spring.cache.type=${SPRING_CACHE_TYPE:redis}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}

spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:5000ms}
spring.data.redis.timeout=${REDIS_TIMEOUT:5000ms}
# =========================================================
# ACTUATOR
# =========================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

management.info.env.enabled=false

info.app.name=Webliix
info.app.version=1.0.0
info.app.description=Webliix ERP CRM SaaS Platform
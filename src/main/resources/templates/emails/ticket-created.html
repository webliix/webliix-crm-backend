<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { background-color: #ffc107; color: #333; padding: 20px; text-align: center; border-radius: 5px 5px 0 0; }
        .content { background-color: #f8f9fa; padding: 20px; }
        .footer { background-color: #e9ecef; padding: 10px; text-align: center; font-size: 12px; border-radius: 0 0 5px 5px; }
        .button { background-color: #ffc107; color: #333; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Ticket Created</h1>
        </div>
        <div class="content">
            <p>A support ticket has been created for you.</p>
            <p><strong>Ticket Details:</strong></p>
            <ul>
                <li>Ticket Number: [TICKET_NUMBER]</li>
                <li>Subject: [SUBJECT]</li>
                <li>Priority: [PRIORITY]</li>
                <li>Status: [STATUS]</li>
            </ul>
            <a href="https://webliix.com/tickets/[TICKET_ID]" class="button">View Ticket</a>
        </div>
        <div class="footer">
            <p>&copy; 2026 Webliix. All rights reserved.</p>
        </div>
    </div>
</body>
</html>

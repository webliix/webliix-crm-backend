<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { background-color: #0056b3; color: white; padding: 20px; text-align: center; border-radius: 5px 5px 0 0; }
        .content { background-color: #f8f9fa; padding: 20px; }
        .footer { background-color: #e9ecef; padding: 10px; text-align: center; font-size: 12px; border-radius: 0 0 5px 5px; }
        .button { background-color: #0056b3; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Quotation Sent</h1>
        </div>
        <div class="content">
            <p>A quotation has been sent to [CUSTOMER_NAME].</p>
            <p><strong>Quotation Details:</strong></p>
            <ul>
                <li>Quotation ID: [QUOTATION_ID]</li>
                <li>Customer: [CUSTOMER_NAME]</li>
                <li>Amount: [AMOUNT]</li>
                <li>Valid Until: [VALID_DATE]</li>
            </ul>
            <a href="https://webliix.com/quotations/[QUOTATION_ID]" class="button">View Quotation</a>
        </div>
        <div class="footer">
            <p>&copy; 2026 Webliix. All rights reserved.</p>
        </div>
    </div>
</body>
</html>

<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { background-color: #28a745; color: white; padding: 20px; text-align: center; border-radius: 5px 5px 0 0; }
        .content { background-color: #f8f9fa; padding: 20px; }
        .footer { background-color: #e9ecef; padding: 10px; text-align: center; font-size: 12px; border-radius: 0 0 5px 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>New Lead Created</h1>
        </div>
        <div class="content">
            <p>A new lead has been created in your Webliix account.</p>
            <p><strong>Lead Details:</strong></p>
            <ul>
                <li>Lead ID: [LEAD_ID]</li>
                <li>Company: [COMPANY_NAME]</li>
                <li>Contact Person: [CONTACT_NAME]</li>
                <li>Email: [EMAIL]</li>
            </ul>
            <p>Log in to Webliix to view more details and manage this lead.</p>
        </div>
        <div class="footer">
            <p>&copy; 2026 Webliix. All rights reserved.</p>
        </div>
    </div>
</body>
</html>

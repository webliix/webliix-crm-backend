spring.application.name=webliix-test
server.port=0

# In-Memory H2 DB in PostgreSQL Compatibility Mode for Unit & Integration Tests
spring.datasource.url=jdbc:h2:mem:webliix_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false
spring.cache.type=none

jwt.secret=webliix-super-secret-key-change-this-in-production-2026
jwt.expiration=604800000

spring.mail.host=localhost
spring.mail.port=25
storage.provider=local
storage.upload-dir=target/test-uploads

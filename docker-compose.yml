version: '3.9'

services:

  webliix:
    build: .
    container_name: webliix-app

    restart: unless-stopped

    depends_on:
      - postgres
      - redis
      - minio

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/webliix_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

      REDIS_HOST: redis
      REDIS_PORT: 6379

      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123

  postgres:
    image: postgres:16

    container_name: webliix-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: webliix_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: webliix-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

  minio:
    image: minio/minio

    container_name: webliix-minio

    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
services:

  webliix:
    build: .
    container_name: webliix-app
    restart: unless-stopped

    depends_on:
      - postgres
      - minio

    ports:
      - "8082:8082"

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: production

  postgres:
    image: postgres:16
    container_name: webliix-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: webliix_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: webliix-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data: